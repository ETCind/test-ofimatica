<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3157d5">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'none'; connect-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self' blob: https://cdn.jsdelivr.net; child-src 'none'; manifest-src 'self'; media-src 'none';">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Test Ofimática C2">
  <title>Test Ofimática C2</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css?build=ofimatica-v2-alpe-20261103">
</head>
<body>
  <main class="app-shell">
    <header class="topbar no-print">
      <button id="homeBtn" class="brand" aria-label="Biblioteca"><span>💻</span><span>Test Ofimática C2</span></button>
      <div id="topActions" class="top-actions"></div>
    </header>
    <section id="libraryView" class="view"></section>
    <section id="trashView" class="view hidden"></section>
    <section id="importView" class="view hidden"></section>
    <section id="editView" class="view hidden"></section>
    <section id="quizView" class="view hidden"></section>
    <section id="resultView" class="view hidden"></section>
    <section id="reviewView" class="view hidden"></section>
    <section id="printReport" class="print-only"></section>
  </main>

  <dialog id="importDialog">
    <form method="dialog" class="dialog-body" id="importForm">
      <h2>Importar tests desde PDF</h2>
      <p>En el Mac, el PDF se analiza en este navegador y no se sube a GitHub. En el iPad la importación se desactiva: carga allí la biblioteca maestra desde iCloud Drive.</p>
      <label class="field"><span>Tema / bloque</span><input id="importTopic" type="text" list="topicSuggestions" placeholder="Elige un tema oficial o escribe un bloque más concreto"></label>
      <datalist id="topicSuggestions">
        <option value="Tema 1 · Windows 11 — entorno, escritorio, Inicio, ventanas, personalización, Snap y escritorios virtuales"></option>
        <option value="Tema 2 · Windows 11 — Explorador, archivos, impresión, Recortes, Chrome y Edge"></option>
        <option value="Tema 3 · Word (Microsoft 365)"></option>
        <option value="Tema 4 · Excel (Microsoft 365)"></option>
        <option value="Tema 5 · Outlook (Microsoft 365)"></option>
        <option value="Tema 6 · Microsoft Teams"></option>
        <option value="Tema 7 · Seguridad informática"></option>
        <option value="Windows 11 · Conceptos básicos, hardware, software y sistema operativo"></option>
        <option value="Windows 11 · Escritorio, Inicio, barra de tareas, iconos, menús y cuadros de diálogo"></option>
        <option value="Windows 11 · Ventanas, Snap Layouts y escritorios virtuales"></option>
        <option value="Windows 11 · Configuración, personalización y widgets"></option>
        <option value="Windows 11 · Explorador, unidades, archivos, carpetas, rutas y acceso rápido"></option>
        <option value="Windows 11 · Vistas, búsqueda, Papelera y ZIP"></option>
        <option value="Windows 11 · Impresión, dispositivos, escáneres y Recortes"></option>
        <option value="Windows 11 · Chrome, Edge y certificados personales"></option>
      </datalist>
      <label class="field"><span>PDF</span><input id="pdfFiles" type="file" accept="application/pdf,.pdf" multiple></label>
      <div id="importProgress" class="progress-note hidden"></div>
      <div class="dialog-actions"><button type="button" class="ghost" id="cancelImport">Cancelar</button><button type="button" class="primary" id="processImport">Analizar PDF</button></div>
    </form>
  </dialog>

  <input id="backupFile" type="file" accept="application/json,.json" class="hidden">
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="pdfjs-loader.mjs?build=ofimatica-v2-alpe-20261103"></script>
  <script src="seed-library.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="sync-core.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="db.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="parser-core.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="pdf-importer.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="report-core.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="app.js?build=ofimatica-v2-alpe-20261103"></script>
  <script src="private-mobile.js?build=ofimatica-v2-alpe-20261103"></script>
</body>
</html>
